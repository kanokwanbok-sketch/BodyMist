<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการคำสั่งซื้อ (Admin) — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-header {
      padding: 64px 0 36px;
      border-bottom: 1px solid var(--border-light);
    }

    .admin-header-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .table-wrapper {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      overflow-x: auto;
    }

    #ordersTable {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
      text-align: left;
    }

    #ordersTable thead {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-light);
    }

    #ordersTable th {
      padding: 18px 20px;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-primary);
      white-space: nowrap;
    }

    #ordersTable td {
      padding: 18px 20px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: none;
    }

    #ordersTable tbody tr:hover {
      background-color: var(--bg-primary);
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: 1px solid var(--border-light);
      padding: 6px 12px;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--text-primary);
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .mobile-menu-btn {
        display: inline-block;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">Body <span>Scent</span></a>

      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">คอลเลกชันสินค้า</a>
        <a href="order.html">สั่งซื้อสินค้า</a>
      </nav>

      <div class="nav-actions">
        <button type="button" onclick="window.location.reload()" class="btn btn-sm">รีเฟรชข้อมูล</button>
        <button type="button" id="menuToggle" class="mobile-menu-btn" aria-label="เมนู">เมนู</button>
      </div>
    </div>
  </header>

  <!-- Admin Page Header -->
  <section class="admin-header">
    <div class="container">
      <div class="admin-header-inner">
        <div>
          <span class="section-subtitle">Order Management</span>
          <h1 class="section-title" style="margin-bottom: 0;">รายการคำสั่งซื้อทั้งหมด</h1>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-muted);">
          แสดงข้อมูลล่าสุดจากระบบอัตโนมัติ (เรียงจากรายการล่าสุดขึ้นก่อน)
        </p>
      </div>
    </div>
  </section>

  <!-- Orders Table Section -->
  <section class="section" style="padding-top: 56px;">
    <div class="container">
      <div class="table-wrapper">
        <table id="ordersTable">
          <thead>
            <tr>
              <th>วันเวลา</th>
              <th>ชื่อลูกค้า</th>
              <th>เบอร์โทร/Line</th>
              <th>รายการสินค้า</th>
              <th>จำนวนเงินรวม</th>
              <th>หมายเหตุ</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="padding-top: 0;">
        © 2026 BODY SCENT — INTERNAL ORDER DASHBOARD.
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
